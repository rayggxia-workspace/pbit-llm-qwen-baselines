name: Task / 协作任务
description: 一项任务一个 Issue；已有同范围任务请继续原 Issue。
title: "[Task] "
body:
  - type: input
    id: owner
    attributes:
      label: 负责人
      description: 实际 GitHub 用户名；创建后同时设置 assignee。
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: 范围与非目标
      description: 写清目录、边界、依赖和与其他成员的分工。
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: 验收标准
      description: 使用可核查的清单。
    validations:
      required: true
  - type: textarea
    id: coordination
    attributes:
      label: 开工核实与交接
      description: 已查看的 Issue/PR/STATUS、基线提交、独立分支/工作目录、个人进度和交接路径。
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: 验证与成果溯源
      description: 实际命令、代码/配置/数据版本、成果位置和 SHA-256；不适用时说明原因。
  - type: textarea
    id: blockers
    attributes:
      label: 当前阶段、阻塞与待同步
      description: 区分本地完成、已推送、PR待审和已合并；说明权限及看板待同步项。
